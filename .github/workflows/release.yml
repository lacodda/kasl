name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps (rdev X11 input monitoring)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxi-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      # All platforms ship tar.gz: kasl update and the npm wrapper of already
      # released versions expect that extension, so it must never change.
      # Both binaries ship: README promises `ka` alongside `kasl`, and until
      # v1.4 the archives carried only `kasl` - so `where ka` came up empty on
      # every machine installed from a release archive or by self-update.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name="kasl-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/kasl.exe" "target/${{ matrix.target }}/release/ka.exe" LICENSE README.md "$name"
          tar czf "$name.tar.gz" "$name"
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="kasl-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/kasl" "target/${{ matrix.target }}/release/ka" LICENSE README.md "$name"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: kasl-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.cliff.outputs.content }}
          files: packages/*
