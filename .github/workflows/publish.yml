name: Publish

# Triggered by the tag push directly (not the release event): releases here
# are created by release.yml with GITHUB_TOKEN, and such events do not start
# other workflows.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (vX.Y.Z)
        required: true

permissions: {}

jobs:
  # Nothing goes to a registry before the release is out. The npm wrapper
  # downloads kasl's binary from the release page, so a package published
  # first answers `npm install` with a 404 until the archives arrive - seen
  # on the window of more than one release - and a release that failed to
  # build should reach no registry at all. Every job below needs this one.
  release:
    name: Wait for the release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 90
    steps:
      - name: Wait for release.yml on the tag's commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          started=$(date +%s)
          while :; do
            run=$(gh run list --workflow release.yml --commit "$sha" --limit 1 --json status,conclusion,url --jq '.[0] // {} | "\(.status // "none") \(.conclusion // "none") \(.url // "-")"')
            read -r status conclusion url <<< "$run"
            case "$status/$conclusion" in
              completed/success) echo "release.yml put $TAG out: $url"; exit 0 ;;
              completed/*) echo "release.yml ended '$conclusion' for $TAG: $url" >&2; exit 1 ;;
              none/*)
                if [ $(( $(date +%s) - started )) -gt 600 ]; then
                  echo "release.yml has not started for $TAG in ten minutes" >&2
                  exit 1
                fi
                ;;
            esac
            sleep 30
          done

  crates-io:
    needs: release
    # historical versions
    # Windows runner: the crate is only build-verified on Windows until 1.0.0
    # (rdev needs X11 dev libs on Linux, untested there yet).
    # /historical versions
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Get a crates.io token (OIDC trusted publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # The wrapper downloads kasl's binary from the release page - which is why
  # it waits for the release above.
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      # npm >= 11.5.1 exchanges the OIDC token itself (trusted publishing);
      # provenance is attached automatically.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          registry-url: https://registry.npmjs.org
      # One README for all three pages: the package's own `prepack` script
      # copies the root file in. Keeping that in the package rather than here
      # means a manual `npm publish` produces the same tarball as CI does.
      - run: npm publish
        working-directory: npm
