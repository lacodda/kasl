name: Docs

on:
  push:
    branches: [main]
    # The workflow itself too: a change to how the site is built is proven
    # by building it, not by the next edit to a page.
    paths: ['docs/**', '.github/workflows/documentation.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # The runner's cached 22.x lags the release, and Astro raises its
          # Node floor in patch versions: without this the build ran on a
          # 22.x below the floor and stopped.
          check-latest: true
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: docs
      - name: Build
        run: pnpm build
        working-directory: docs
      # docs/public/CNAME is copied into dist by Astro, which is what keeps
      # kasl.lacodda.com pointing at this site.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
