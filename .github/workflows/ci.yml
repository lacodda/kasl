name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Linux and macOS are untested until 1.0.0: report failures, don't block
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps (rdev X11 input monitoring)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxi-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      # Doctests are excluded: 175 of 212 doc examples predate gating and do
      # not compile; repairing them is scheduled with the docs overhaul.
      - name: Test
        run: cargo test --all-targets
      - name: Build
        run: cargo build --release
